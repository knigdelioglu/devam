<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devam</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">↻</span>
      <div><h1>Devam</h1><p>ChatGPT otomatik devam</p></div>
    </header>
    <section class="status" aria-live="polite">
      <span id="indicator" class="indicator"></span>
      <div><strong id="state">Kontrol ediliyor…</strong><p id="detail">Aktif sekme okunuyor.</p></div>
    </section>
    <label for="limit">En fazla otomatik devam</label>
    <input id="limit" type="number" min="1" max="100" step="1" value="20" inputmode="numeric">
    <p class="hint">Yalnızca bu sekmede çalışır. Sayfa yenilenirse kapanır.</p>
    <p id="count" class="count">Gönderilen: 0 / 20</p>
    <div class="actions">
      <button type="button" id="start">Başlat</button>
      <button type="button" id="stop" class="secondary" disabled>Durdur</button>
    </div>
    <p class="note">Taslağını değiştirmez; yanıt tamamlanmadan göndermez.</p>
  </main>
</body>
</html>
